# H2 In-Memory Database for Tests
spring.datasource.url=jdbc:h2:mem:sagasia_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Security
app.security.token.secret=test-token-secret-test-token-secret-test-token-secret
app.security.token.expiration-minutes=120
app.security.seed.admin.email=admin@test.com
app.security.seed.admin.password=Test@123

# CORS
app.cors.allowed-origin=http://localhost:3000

# API
app.api.base-path=/api


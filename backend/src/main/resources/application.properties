spring.application.name=sagasia
server.port=${SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:sagasia_crm}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Security
app.security.token.secret=${APP_SECURITY_TOKEN_SECRET:change-this-dev-token-secret-change-this-dev-token-secret}
app.security.token.expiration-minutes=${APP_SECURITY_TOKEN_EXPIRATION_MINUTES:120}
app.security.seed.admin.email=${APP_SECURITY_SEED_ADMIN_EMAIL:admin@sagasia.com}
app.security.seed.admin.password=${APP_SECURITY_SEED_ADMIN_PASSWORD:Admin@123}

# CORS
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}

# API
app.api.base-path=/api

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
